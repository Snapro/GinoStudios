    // ─── HOOKS ────────────────────────────────────────────────────────────────
    function useIsMobile() {
      const [v, setV] = useState(window.innerWidth < 768);
      useEffect(() => {
        const fn = () => setV(window.innerWidth < 768);
        window.addEventListener("resize", fn);
        return () => window.removeEventListener("resize", fn);
      }, []);
      return v;
    }

    function AnimatedNumber({ value }) {
      const [disp, setDisp] = useState(value);
      const ref = useRef(value);
      useEffect(() => {
        const s = ref.current, e = value, t0 = performance.now();
        const tick = (now) => {
          const p = Math.min((now - t0) / 450, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          setDisp(Math.round(s + (e - s) * ease));
          if (p < 1) requestAnimationFrame(tick);
          else ref.current = e;
        };
        requestAnimationFrame(tick);
      }, [value]);
      return <span>{Math.round(disp).toLocaleString()}</span>;
    }

                </div>
                <input
                  type="range"

            {/* 03 · DELIVERY SPEED */}
            <div style={{ padding: isMobile ? "0 16px" : 0, marginBottom: isMobile ? 24 : 32 }}>
              <div style={{ fontSize: 8, letterSpacing: "0.25em", color: "#252520", textTransform: "uppercase", marginBottom: 10 }}>03 · Delivery Speed</div>
              <div style={{ display: "flex", gap: 8 }}>
                {[
                  { key: false, label: "Standard", sub: "Normal turnaround" },

                  <button
                    key={String(opt.key)}

                    style={{
                      flex: 1,
                      padding: isMobile ? "14px 12px" : "14px 20px",
                      background: rush === opt.key ? (opt.key ? "#1a1008" : "#13120e") : "transparent",
                      border: rush === opt.key ? `1.5px solid ${opt.key ? "#E8854A" : pd.color}` : "1.5px solid #1a1a17",

                      cursor: "pointer",

                  >
                    <div style={{ fontSize: 10, fontWeight: 700, color: rush === opt.key ? (opt.key ? "#E8854A" : pd.color) : "#333", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 3 }}>{opt.label}</div>
                    <div style={{ fontSize: 9, color: "#2a2a24", letterSpacing: "0.05em" }}>{opt.sub}</div>

              </div>
            </div>

            {/* 04 · PLAN CARDS */}
            <div style={{ padding: isMobile ? "0 16px" : 0, marginBottom: isMobile ? 20 : 32 }}>
              <div style={{ fontSize: 8, letterSpacing: "0.25em", color: "#252520", textTransform: "uppercase", marginBottom: 10 }}>04 · Select Package</div>

              {isMobile ? (
                <>
                  {/* Mobile plan pills */}
                  <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
                    {Object.entries(svc.plans).map(([pk, p]) => (
                      <button
                        key={pk}
                        onClick={() => { setPlan(pk); setFeatOpen(false); }}
                        style={{
                          flex: 1,
                          padding: "13px 4px",
                          background: plan === pk ? p.color : "#0f0f0c",
                          border: plan === pk ? `1px solid ${p.color}` : "1px solid #1a1a17",
                          borderRadius: 4,
                          color: plan === pk ? "#000" : "#383830",
                          fontSize: 9,
                          fontWeight: 700,
                          letterSpacing: "0.1em",
                          textTransform: "uppercase",
                          cursor: "pointer",
                          transition: "all 0.25s",
                        }}
                      >
                        {p.name}
                      </button>
                    ))}
                  </div>

                  {/* Mobile active plan card */}
                  <div style={{ background: "linear-gradient(155deg,#161210,#0d0b09)", border: `1.5px solid ${pd.color}`, borderRadius: 8, padding: "24px 20px", boxShadow: `0 16px 48px rgba(0,0,0,0.5), inset 0 1px 0 ${pd.color}14` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
                      <div>
                        <div style={{ width: 7, height: 7, borderRadius: "50%", background: pd.color, boxShadow: `0 0 10px ${pd.color}88`, marginBottom: 10 }} />
                        <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 24, fontWeight: 600, color: "#fff", letterSpacing: "-0.02em" }}>{pd.name}</div>
                        <div style={{ fontSize: 9, color: pd.color, letterSpacing: "0.1em", textTransform: "uppercase", marginTop: 2 }}>{pd.tagline}</div>
                        <div style={{ fontSize: 8, color: "#282820", marginTop: 4 }}>Intl. equiv. {pd.usdRef}</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 44, fontWeight: 700, color: "#fff", letterSpacing: "-0.04em", lineHeight: 1 }}>
                          <span style={{ fontSize: 16, fontWeight: 400, verticalAlign: "super" }}>K</span>
                          <AnimatedNumber value={total} />
                        </div>
                        <div style={{ fontSize: 8, color: "#383830", textTransform: "uppercase", marginTop: 4 }}>per project</div>
                        {rush && <div style={{ fontSize: 8, color: "#E8854A", marginTop: 2 }}>Rush +35%</div>}
                      </div>
                    </div>

                    {extra > 0 && (
                      <div style={{ background: "#0a0a08", border: "1px solid #1c1c18", borderRadius: 4, padding: "7px 12px", fontSize: 9, color: "#383830", marginBottom: 14 }}>
                        Base K{pd.basePrice.toLocaleString()} + {extra} extra × K{pd.pricePerUnit.toLocaleString()}
                      </div>
                    )}

                    <div style={{ display: "flex", alignItems: "center", gap: 7, paddingBottom: 14, borderBottom: "1px solid #181814", marginBottom: 14 }}>
                      <div style={{ width: 4, height: 4, borderRadius: "50%", background: pd.color }} />
                      <span style={{ fontSize: 9, color: "#555", letterSpacing: "0.06em", textTransform: "uppercase" }}>{pd.turnaround}</span>
                    </div>

                    <button
                      onClick={() => setFeatOpen(v => !v)}
                      style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", background: "transparent", border: "none", padding: "10px 0", color: "#444", fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", cursor: "pointer" }}
                    >
                      <span>What's included ({pd.features.length})</span>
                      <span style={{ fontSize: 18, color: pd.color, display: "inline-block", transform: featOpen ? "rotate(45deg)" : "rotate(0deg)", transition: "transform 0.2s" }}>+</span>
                    </button>
                    {featOpen && (
                      <div style={{ paddingTop: 12 }}>
                        {pd.features.map((f, i) => (
                          <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 10 }}>
                            <div style={{ width: 4, height: 4, borderRadius: "50%", background: pd.color, flexShrink: 0, marginTop: 5 }} />
                            <span style={{ fontSize: 10, color: "#666", letterSpacing: "0.04em", lineHeight: 1.6 }}>{f}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </>
              ) : (
                <div style={{ display: "flex", gap: 14 }}>
                  {Object.entries(svc.plans).map(([pk, p]) => (
                    <DesktopCard key={pk} planKey={pk} pd={p} usage={u} selected={plan} onSelect={setPlan} rush={rush} />
                  ))}
                </div>
              )}
            </div>

            {/* SUMMARY */}
            {isMobile ? (
              <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(7,7,5,0.95)", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)", borderTop: `1px solid ${pd.color}44`, padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", zIndex: 30 }}>
                <div>
                  <div style={{ fontSize: 7, color: "#282820", letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 3 }}>
                    {svc.label} · {pd.name}{rush ? " · Rush" : ""}
                  </div>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 30, fontWeight: 700, color: "#fff", lineHeight: 1 }}>
                    <span style={{ fontSize: 13, verticalAlign: "super", fontWeight: 400 }}>K</span>
                    <AnimatedNumber value={total} />
                  </div>
                  <div style={{ fontSize: 7, color: "#2e2e28", marginTop: 2, letterSpacing: "0.06em" }}>
                    Per project · {pd.usdRef} intl. ref
                  </div>
                </div>
                <button onClick={() => setShowForm(true)} style={{ padding: "14px 20px", background: pd.color, color: "#000", border: "none", borderRadius: 4, fontSize: 10, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", cursor: "pointer" }}>
                  Request Quote →
                </button>
              </div>
            ) : (
              <div style={{ background: "linear-gradient(135deg,#0e0d0b,#111)", border: `1px solid ${pd.color}22`, borderRadius: 6, padding: "28px 32px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 24, marginTop: 8 }}>
                <div>
                  <div style={{ fontSize: 8, letterSpacing: "0.2em", color: "#252520", textTransform: "uppercase", marginBottom: 8 }}>Project Estimate</div>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 15, color: "#555" }}>
                    <span style={{ color: pd.color }}>{svc.label}</span>
                    {" · "}<span style={{ color: "#777" }}>{pd.name}</span>
                    {" · "}{u} {svc.usageUnit}
                    {rush && <span style={{ color: "#E8854A" }}> · Rush delivery</span>}
                  </div>
                  <div style={{ fontSize: 9, color: "#282820", marginTop: 5, letterSpacing: "0.06em" }}>
                    International equivalent: {pd.usdRef} USD · {pd.deliverable}
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 32 }}>
                  <div>
                    <div style={{ fontSize: 8, letterSpacing: "0.15em", color: "#202018", textTransform: "uppercase", marginBottom: 4 }}>Project Total</div>
                    <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 40, fontWeight: 700, color: "#fff", lineHeight: 1 }}>
                      <span style={{ fontSize: 16, fontWeight: 400, verticalAlign: "super" }}>K</span>
                      <AnimatedNumber value={total} />
                    </div>
                  </div>
                  <button
                    onClick={() => setShowForm(true)}
                    style={{ padding: "15px 36px", background: pd.color, color: "#000", border: "none", borderRadius: 3, fontSize: 10, fontWeight: 700, letterSpacing: "0.15em", textTransform: "uppercase", cursor: "pointer" }}>
                    Request a Quote →
                  </button>
                </div>
              </div>
            )}

            <div style={{ textAlign: "center", marginTop: 32, padding: isMobile ? "0 20px" : 0 }}>
              <p style={{ fontSize: 9, color: "#1c1c18", letterSpacing: "0.1em" }}>
                All estimates are indicative · Final pricing confirmed after project brief · © 2024 Gino Studios Zambia
              </p>
            </div>

          </div>

          {/* ── QUOTE FORM OVERLAY ── */}
          {showForm && (
            <QuoteForm
              svc={svc}
              pd={pd}
              u={u}
              rush={rush}
              total={total}
              onClose={() => setShowForm(false)}
              isMobile={isMobile}
            />
          )}
        </div>
      );
    }

    // ─── QUOTE FORM ───────────────────────────────────────────────────────────
    function QuoteForm({ svc, pd, u, rush, total, onClose, isMobile }) {
      const [step, setStep] = useState("form"); // form | generating | brief
      const [copied, setCopied] = useState(false);
      const [brief, setBrief] = useState("");
      const [form, setForm] = useState({
        name: "", company: "", email: "", phone: "",
        description: "", timeline: "", budget_flexible: "no", referral: "",
      });

      const accentColor = pd.color;
      const rushLabel = rush ? " · Rush Delivery (+35%)" : " · Standard Delivery";

      const inputStyle = {
        width: "100%",
        background: "#0c0c0a",
        border: "1px solid #222",
        borderRadius: 4,
        padding: "12px 14px",
        color: "#bbb",
        fontSize: 11,
        fontFamily: "'DM Mono', monospace",
        letterSpacing: "0.04em",
        outline: "none",
        transition: "border-color 0.2s",
      };

      const labelStyle = {
        fontSize: 8,
        letterSpacing: "0.2em",
        color: "#383830",
        textTransform: "uppercase",
        marginBottom: 6,
        display: "block",
      };

      const fieldWrap = { marginBottom: 18 };

      const set = (key) => (e) => setForm(f => ({ ...f, [key]: e.target.value }));

      async function handleSubmit() {
        if (!form.name || !form.email || !form.description) return;
        setStep("generating");

        const extra = Math.max(0, u - pd.usageBase);
        const baseCalc = pd.basePrice + extra * pd.pricePerUnit;
        const totalCalc = rush ? Math.round(baseCalc * 1.35) : baseCalc;

        const prompt = `You are a creative project coordinator at Gino Studios Zambia, a premium creative agency.

A potential client has submitted a project enquiry through the pricing calculator. Compile this into a polished, professional project brief email — ready for the client to copy and send directly to Gino Studios, OR for the studio to use as an intake document.

Use a refined, confident tone. Format it cleanly with clear sections. Do not use markdown symbols like ** or ##. Use plain text with section headers in ALL CAPS followed by a colon and line break.

CLIENT INFORMATION:
- Name: ${form.name}
- Company / Organisation: ${form.company || "Not provided"}
- Email: ${form.email}
- Phone: ${form.phone || "Not provided"}
- How they found us: ${form.referral || "Not provided"}

SELECTED SERVICE CONFIGURATION:
- Service: ${svc.label}
- Package: ${pd.name} (${pd.tagline})
- Scope: ${u} ${svc.usageUnit}
- Delivery: ${rush ? "Rush (+35%)" : "Standard"}
- Estimated Project Value: K${totalCalc.toLocaleString()} (International equivalent: ${pd.usdRef} USD)
- Deliverable: ${pd.deliverable}
- Turnaround: ${pd.turnaround}
- Package includes: ${pd.features.join(", ")}

PROJECT DESCRIPTION FROM CLIENT:
${form.description}

PREFERRED TIMELINE: ${form.timeline || "Flexible"}
BUDGET FLEXIBILITY: ${form.budget_flexible === "yes" ? "Open to discussion" : "Fixed to estimate"}

Write the compiled project brief now. It should begin with a subject line suggestion, then the full brief body. Make it feel like a real professional document — not a form dump. Highlight what the client needs, match it to what the selected package delivers, and end with a clear next steps section.`;

        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1000,
              messages: [{ role: "user", content: prompt }],
            }),
          });
          const data = await res.json();
          const text = data.content?.map(b => b.text || "").join("") || "Could not generate brief. Please try again.";
          setBrief(text);
          setStep("brief");
        } catch (err) {
          setBrief("Something went wrong generating your brief. Please check your connection and try again.");
          setStep("brief");
        }
      }

      function handleCopy() {
        // Primary: modern Clipboard API
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(brief).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2500);
          }).catch(() => fallbackCopy());
        } else {
          fallbackCopy();
        }
      }

      function fallbackCopy() {
        // Fallback: create a hidden textarea, select it, execCommand copy
        const ta = document.createElement("textarea");
        ta.value = brief;
        ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0;";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand("copy");
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        } catch (e) {
          // Last resort: prompt user to copy manually
          window.prompt("Copy the brief below (Ctrl+C / Cmd+C):", brief);
        }
        document.body.removeChild(ta);
      }

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 100,
          background: "rgba(4,4,3,0.96)",
          backdropFilter: "blur(24px)",
          WebkitBackdropFilter: "blur(24px)",
          overflowY: "auto",
          display: "flex",
          alignItems: "flex-start",
          justifyContent: "center",
          padding: isMobile ? "0" : "40px 24px",
        }}>
          <div style={{
            width: "100%",
            maxWidth: 680,
            background: "#0a0a08",
            border: `1px solid ${accentColor}33`,
            borderRadius: isMobile ? 0 : 8,
            padding: isMobile ? "32px 20px 100px" : "48px 48px 48px",
            position: "relative",
            minHeight: isMobile ? "100vh" : "auto",
          }}>

            {/* Close */}
            <button
              onClick={onClose}
              style={{ position: "absolute", top: 20, right: 20, background: "transparent", border: "none", color: "#333", fontSize: 22, cursor: "pointer", lineHeight: 1 }}
            >×</button>

            {/* ── STEP: FORM ── */}
            {step === "form" && (
              <>
                {/* Header */}
                <div style={{ marginBottom: 36 }}>
                  <div style={{ fontSize: 8, letterSpacing: "0.3em", color: accentColor, textTransform: "uppercase", marginBottom: 12 }}>
                    ◆ Project Enquiry
                  </div>
                  <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: isMobile ? 32 : 40, fontWeight: 600, color: "#fff", letterSpacing: "-0.03em", lineHeight: 1, marginBottom: 10 }}>
                    Tell us about<br />
                    <em style={{ color: accentColor, fontStyle: "italic" }}>your project.</em>
                  </h2>
                  <p style={{ fontSize: 10, color: "#383830", letterSpacing: "0.06em", lineHeight: 1.8 }}>
                    Fill in your details and we'll compile a complete project brief — ready to send in one click.
                  </p>
                </div>

                {/* Selected package summary pill */}
                <div style={{ background: "#111", border: `1px solid ${accentColor}33`, borderRadius: 6, padding: "14px 18px", marginBottom: 28, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <div>
                    <div style={{ fontSize: 8, letterSpacing: "0.2em", color: "#2e2e28", textTransform: "uppercase", marginBottom: 4 }}>Selected Package</div>
                    <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 16, color: "#888" }}>
                      <span style={{ color: accentColor }}>{svc.label}</span> · {pd.name} · {u} {svc.usageUnit}{rushLabel}
                    </div>
                  </div>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 28, fontWeight: 700, color: "#fff" }}>
                    K{total.toLocaleString()}
                  </div>
                </div>

                {/* Form fields */}
                <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: "0 20px" }}>
                  <div style={fieldWrap}>
                    <label style={labelStyle}>Full Name *</label>
                    <input style={inputStyle} value={form.name} onChange={set("name")} placeholder="e.g. Joshua Bolton" />
                  </div>
                  <div style={fieldWrap}>
                    <label style={labelStyle}>Company / Organisation</label>
                    <input style={inputStyle} value={form.company} onChange={set("company")} placeholder="e.g. Apex Interiors Ltd" />
                  </div>
                  <div style={fieldWrap}>
                    <label style={labelStyle}>Email Address *</label>
                    <input style={inputStyle} type="email" value={form.email} onChange={set("email")} placeholder="you@company.com" />
                  </div>
                  <div style={fieldWrap}>
                    <label style={labelStyle}>Phone / WhatsApp</label>
                    <input style={inputStyle} value={form.phone} onChange={set("phone")} placeholder="+260 9XX XXX XXX" />
                  </div>
                </div>

                <div style={fieldWrap}>
                  <label style={labelStyle}>Project Description * — What do you need, and why?</label>
                  <textarea
                    style={{ ...inputStyle, height: 120, resize: "vertical" }}
                    value={form.description}
                    onChange={set("description")}
                    placeholder="Describe your project — the space, the goal, the audience, any reference styles or inspirations you have in mind..."
                  />
                </div>

                <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: "0 20px" }}>
                  <div style={fieldWrap}>
                    <label style={labelStyle}>Ideal Start / Deadline</label>
                    <input style={inputStyle} value={form.timeline} onChange={set("timeline")} placeholder="e.g. Start ASAP, deliver by June" />
                  </div>
                  <div style={fieldWrap}>
                    <label style={labelStyle}>Is the budget flexible?</label>
                    <select style={{ ...inputStyle, cursor: "pointer" }} value={form.budget_flexible} onChange={set("budget_flexible")}>
                      <option value="no">No — fixed to the estimate</option>
                      <option value="yes">Yes — open to discussion</option>
                    </select>
                  </div>
                </div>

                <div style={fieldWrap}>
                  <label style={labelStyle}>How did you find us?</label>
                  <input style={inputStyle} value={form.referral} onChange={set("referral")} placeholder="e.g. Instagram, word of mouth, Google..." />
                </div>

                <button
                  onClick={handleSubmit}
                  disabled={!form.name || !form.email || !form.description}
                  style={{
                    width: "100%",
                    padding: "16px 0",
                    background: (!form.name || !form.email || !form.description) ? "#1a1a14" : accentColor,
                    color: (!form.name || !form.email || !form.description) ? "#333" : "#000",
                    border: "none",
                    borderRadius: 4,
                    fontSize: 11,
                    fontWeight: 700,
                    letterSpacing: "0.15em",
                    textTransform: "uppercase",
                    cursor: (!form.name || !form.email || !form.description) ? "not-allowed" : "pointer",
                    transition: "all 0.3s",
                    marginTop: 8,
                  }}
                >
                  Compile Project Brief →
                </button>
                <div style={{ textAlign: "center", marginTop: 10, fontSize: 9, color: "#252520", letterSpacing: "0.06em" }}>
                  * Required fields · Your brief is generated instantly using AI
                </div>
              </>
            )}

            {/* ── STEP: GENERATING ── */}
            {step === "generating" && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: 360, gap: 24 }}>
                <div style={{ width: 48, height: 48, borderRadius: "50%", border: `2px solid ${accentColor}22`, borderTop: `2px solid ${accentColor}`, animation: "spin 0.9s linear infinite" }} />
                <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
                <div>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 26, color: "#fff", textAlign: "center", marginBottom: 8 }}>Compiling your brief…</div>
                  <div style={{ fontSize: 10, color: "#383830", textAlign: "center", letterSpacing: "0.06em" }}>Claude is drafting your project document</div>
                </div>
              </div>
            )}

            {/* ── STEP: BRIEF ── */}
            {step === "brief" && (
              <>
                <div style={{ marginBottom: 28 }}>
                  <div style={{ fontSize: 8, letterSpacing: "0.3em", color: accentColor, textTransform: "uppercase", marginBottom: 12 }}>
                    ◆ Your Project Brief
                  </div>
                  <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: isMobile ? 30 : 38, fontWeight: 600, color: "#fff", letterSpacing: "-0.03em", lineHeight: 1, marginBottom: 10 }}>
                    Ready to send.
                  </h2>
                  <p style={{ fontSize: 10, color: "#383830", letterSpacing: "0.06em", lineHeight: 1.8 }}>
                    Copy the brief below and paste it directly into an email to <span style={{ color: accentColor }}>hello@ginostudios.co.zm</span>
                  </p>
                </div>

                {/* Brief output box */}
                <div style={{
                  background: "#0d0d0b",
                  border: `1px solid ${accentColor}44`,
                  borderRadius: 6,
                  padding: "24px",
                  marginBottom: 20,
                  fontFamily: "'DM Mono', monospace",
                  fontSize: 11,
                  color: "#888",
                  lineHeight: 1.85,
                  letterSpacing: "0.03em",
                  whiteSpace: "pre-wrap",
                  maxHeight: 420,
                  overflowY: "auto",
                }}>
                  {brief}
                </div>

                {/* Action buttons */}
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  <button
                    onClick={handleCopy}
                    style={{
                      flex: 2,
                      padding: "15px 0",
                      background: copied ? "#1a3a1a" : accentColor,
                      color: copied ? "#4CAF50" : "#000",
                      border: copied ? "1.5px solid #4CAF50" : "none",
                      borderRadius: 4,
                      fontSize: 11,
                      fontWeight: 700,
                      letterSpacing: "0.15em",
                      textTransform: "uppercase",
                      cursor: "pointer",
                      transition: "all 0.3s",
                    }}
                  >
                    {copied ? "✓ Copied to Clipboard" : "Copy Brief →"}
                  </button>
                  <button
                    onClick={() => setStep("form")}
                    style={{ flex: 1, padding: "15px 0", background: "transparent", color: "#444", border: "1px solid #222", borderRadius: 4, fontSize: 10, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", cursor: "pointer" }}
                  >
                    ← Edit
                  </button>
                </div>

                <div style={{ marginTop: 12, fontSize: 9, color: "#222", textAlign: "center", letterSpacing: "0.06em" }}>
                  This brief was compiled by Claude AI from the information you provided
                </div>
              </>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<GinoPricing />);
  </script>
</body>
</html>
